<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230e0e14'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%237c5cff'/%3E%3C/svg%3E">
<title>Grid Paint Labs — App Switcher</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js" defer></script>
<style>
  :root{ --bg:#0e0e14; --panel:#1a1a24; --line:#222230; --accent:#c2a878; --text:#f5f1e8; --dim:#9a958c; }
  *{ font-family:'JetBrains Mono', ui-monospace, monospace; }
  html,body{ margin:0; background:var(--bg); color:var(--text); }
  #bar{ display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); background:#0e0e14; flex-wrap:wrap; }
  #bar h1{ font-size:12px; letter-spacing:.18em; margin:0 8px 0 0; }
  #bar h1 .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); margin-right:8px; }
  #buttons{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .appbtn{ display:inline-flex; align-items:center; gap:6px; padding:7px 12px; font-size:11px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; }
  .appbtn svg{ display:block; flex:none; }
  .appbtn:hover{ background:#222230; }
  .appbtn.active{ background:var(--accent); color:#000; border-color:var(--accent); font-weight:bold; }
  #status{ font-size:10px; color:var(--dim); letter-spacing:.08em; }
  #pick{ display:none; gap:10px; align-items:center; padding:14px; font-size:11px; color:var(--dim); }
  #pick.show{ display:flex; }
  #pick button{ padding:7px 12px; font-size:11px; border-radius:6px; border:1px solid var(--accent); background:transparent; color:var(--accent); cursor:pointer; }
  #err{ display:none; margin:0 14px 10px; padding:10px; font-size:11px; white-space:pre-wrap; color:#e84855; background:#15151f; border:1px solid var(--line); border-radius:6px; max-height:220px; overflow:auto; }
  #err.show{ display:block; }
  #stage{ padding:0; }
</style>
</head>
<body>
<div id="bar">
  <h1><span class="dot"></span>GRID PAINT LABS</h1>
  <span id="buttons"></span>
  <span id="status">starting…</span>
</div>
<div id="pick">
  <span>Could not fetch app sources (this page needs http:// — e.g. run <code>python3 -m http.server</code> in the repo root — or point it at the folder directly):</span>
  <button id="pickbtn">Choose lab-sources folder…</button>
  <input type="file" id="picker" webkitdirectory hidden>
</div>
<pre id="err"></pre>
<div id="stage"><div id="root"></div></div>
<script type="module">
import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
import { createElement } from 'https://esm.sh/react@18.3.1';

const REACT_URL = 'https://esm.sh/react@18.3.1';
const REACT_DOM_URL = 'https://esm.sh/react-dom@18.3.1';
const JSX_RUNTIME_URL = 'https://esm.sh/react@18.3.1/jsx-runtime';
// Bare npm specifiers cannot stay in blob modules (no import map). Vite would
// also rewrite them to `/node_modules/.vite/deps/…`, which blobs cannot load.
const NPM_URLS = {
  'd3-contour': 'https://esm.sh/d3-contour@4',
};

// NCTGraphite library resolution: lab App.tsx files import from
// '@nct/nctgraphite', served from the submodule checkout. Compiled
// library modules are cached as blob URLs per load and revoked on teardown.
const LIB_INDEX = 'NCTGraphite/packages/nctgraphite/src/index.ts';
const THEME_CSS = 'NCTGraphite/packages/nctgraphite/src/theme/NCTGraphiteTheme.css';
const moduleCache = new Map();
const textCache = new Map();
let ownedUrls = [];

async function fetchText(path) {
  if (textCache.has(path)) return textCache.get(path);
  const res = await fetch(path);
  if (!res.ok) throw new Error(`fetch failed ${path}: ${res.status}`);
  const contentType = res.headers.get('content-type') || '';
  // Vite dev answers unknown paths with the index.html fallback page;
  // treat that as a miss so the .tsx → .ts probe can fall through.
  if (contentType.includes('text/html') && !path.endsWith('.html')) {
    throw new Error(`fetch failed ${path}: got HTML fallback page`);
  }
  const text = await res.text();
  textCache.set(path, text);
  return text;
}

async function resolveRelative(dir, spec) {
  const noJs = dir + spec.replace(/\.js$/, '');
  if (/\.(ts|tsx|css)$/.test(noJs)) return noJs;
  for (const ext of ['.tsx', '.ts']) {
    try {
      await fetchText(noJs + ext);
      return noJs + ext;
    } catch (e) { /* try next */ }
  }
  return noJs;
}

function rewriteBareNpm(src) {
  for (const [name, url] of Object.entries(NPM_URLS)) {
    src = src.split(`from '${name}'`).join(`from '${url}'`).split(`from "${name}"`).join(`from '${url}'`);
    const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    src = src.replace(
      new RegExp(`from\\s*(['"])\\/node_modules\\/\\.vite\\/deps\\/${escaped}\\.js[^'"]*\\1`, 'g'),
      `from '${url}'`
    );
  }
  const reactDomClient = `${REACT_DOM_URL}/client`;
  src = src.replace(
    /from\s*(['"])\/node_modules\/\.vite\/deps\/react-dom\.js[^'"]*\1/g,
    `from '${REACT_DOM_URL}'`
  );
  return src
    .replace(/from\s*(['"])react-dom\/client\1/g, `from '${reactDomClient}'`)
    .replace(/from\s*(['"])react-dom\1/g, `from '${REACT_DOM_URL}'`)
    .replace(/from\s*(['"])react\/jsx-runtime\1/g, `from '${JSX_RUNTIME_URL}'`)
    .replace(/from\s*(['"])react\1/g, `from '${REACT_URL}'`);
}

async function rewriteLabImports(src, dir) {
  const specs = [...new Set(
    [...src.matchAll(/from\s*(['"])(\.[^'"]+|@nct\/nctgraphite)\1/g)].map((m) => m[2])
  )];
  for (const spec of specs) {
    const dep = spec === '@nct/nctgraphite' ? LIB_INDEX : await resolveRelative(dir, spec);
    const url = await compileModule(dep);
    src = src.split(`from '${spec}'`).join(`from '${url}'`).split(`from "${spec}"`).join(`from "${url}"`);
  }
  return rewriteBareNpm(src);
}

async function compileModule(path) {
  if (moduleCache.has(path)) return moduleCache.get(path);
  let src = await fetchText(path);
  if (/\.tsx?$/.test(path)) {
    src = Babel.transform(src, {
      filename: path,
      presets: [
        ['typescript', { isTSX: true, allExtensions: true }],
        ['react', { runtime: 'automatic' }],
      ],
    }).code;
  }
  const dir = path.slice(0, path.lastIndexOf('/') + 1);
  src = await rewriteLabImports(src, dir);
  const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  ownedUrls.push(url);
  moduleCache.set(path, url);
  return url;
}

async function compileSource(path, text) {
  const dir = path.slice(0, path.lastIndexOf('/') + 1);
  let src = Babel.transform(text, {
    filename: path,
    presets: [
      ['typescript', { isTSX: true, allExtensions: true }],
      ['react', { runtime: 'automatic' }],
    ],
  }).code;
  return rewriteLabImports(src, dir);
}

function labIcon(inner) {
  return `<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}

const APPS = [
  {
    id: 'hull',
    title: 'Grid Cell Hull Lab',
    dir: 'lab-sources/Grid+Cell+Hull+Lab',
    icon: labIcon('<rect x="3" y="3" width="3" height="3"/><rect x="6.5" y="3" width="3" height="3"/><rect x="10" y="6.5" width="3" height="3"/><rect x="3" y="6.5" width="3" height="3"/><polygon points="2.5,10 2.5,2.5 10,2.5 13.5,6 13.5,13.5 6,13.5"/>'),
  },
  {
    id: 'shading',
    title: 'Grid Dot Shading Lab',
    dir: 'lab-sources/Grid+Dot+Shading+Lab',
    icon: labIcon('<circle cx="4" cy="4" r="1.1" fill="currentColor" stroke="none"/><circle cx="8" cy="4" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="4" r="1.2" fill="currentColor" stroke="none"/><circle cx="4" cy="8" r="1.6" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="2.2" fill="currentColor" stroke="none"/><circle cx="12" cy="8" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="8" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/>'),
  },
  {
    id: 'hex',
    title: 'Hex Grid Cell Paint',
    dir: 'lab-sources/Hex+Grid+Cell+Paint',
    icon: labIcon('<polygon points="8,1.6 13.6,4.8 13.6,11.2 8,14.4 2.4,11.2 2.4,4.8"/><polygon points="8,5.2 10.8,6.8 10.8,10 8,11.6 5.2,10 5.2,6.8"/>'),
  },
  {
    id: 'arc',
    title: 'Metaball Grid Lab',
    dir: 'lab-sources/Arc+Metaball+Grid+Lab',
    icon: labIcon('<circle cx="6" cy="8" r="4"/><circle cx="10.4" cy="8" r="3.2"/>'),
  },
  {
    id: 'vector',
    title: 'Grid Paint Vector Field Lab',
    dir: 'lab-sources/Grid+Paint+Vector+Field+Key',
    icon: labIcon('<path d="M2 5.5h5l-1.6-1.6M7 5.5l-1.6 1.6"/><path d="M5.5 10.5h7l-2.1-2.1M12.5 10.5l-2.1 2.1"/><path d="M3.5 13h4"/>'),
  },
];

const buttonsEl = document.getElementById('buttons');
const statusEl = document.getElementById('status');
const errEl = document.getElementById('err');
const pickEl = document.getElementById('pick');
const pickerEl = document.getElementById('picker');
let root = null;
let blobUrl = null;
let currentId = null;

for (const app of APPS.filter((a) => !a.hidden)) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'appbtn';
  b.dataset.app = app.id;
  b.innerHTML = `${app.icon}<span>${app.title}</span>`;
  b.addEventListener('click', () => loadApp(app.id));
  buttonsEl.appendChild(b);
}

function setStatus(t) { statusEl.textContent = t; }
function showError(e) {
  errEl.textContent = String((e && e.stack) || e);
  errEl.classList.add('show');
}
function clearError() {
  errEl.textContent = '';
  errEl.classList.remove('show');
}

function teardown() {
  if (root) { try { root.unmount(); } catch (e) { /* already gone */ } root = null; }
  document.querySelectorAll('[data-app-asset]').forEach((n) => n.remove());
  if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
  for (const u of ownedUrls) { try { URL.revokeObjectURL(u); } catch (e) { /* already gone */ } }
  ownedUrls = [];
  moduleCache.clear();
  textCache.clear();
  document.getElementById('root').innerHTML = '';
}

function injectCss(cssText) {
  const fonts = [...cssText.matchAll(/@import\s+url\((['"]?)(https?:[^)'"]+)\1\)\s*;/g)].map((m) => m[2]);
  for (const href of fonts) {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = href;
    link.setAttribute('data-app-asset', '');
    document.head.appendChild(link);
  }
  const rest = cssText.replace(/@import\s+url\((['"]?)https?:[^)'"]+\1\)\s*;/g, '');
  const style = document.createElement('style');
  style.type = 'text/tailwindcss';
  style.setAttribute('data-app-asset', '');
  style.textContent = rest;
  document.head.appendChild(style);
}

async function mountCompiled(jsCode) {
  const blob = new Blob([jsCode], { type: 'text/javascript' });
  blobUrl = URL.createObjectURL(blob);
  const mod = await import(/* @vite-ignore */ blobUrl);
  const App = mod.default;
  if (typeof App !== 'function') throw new Error('App.tsx has no default component export');
  root = createRoot(document.getElementById('root'));
  root.render(createElement(App));
}

async function loadApp(id, files) {
  const app = APPS.find((a) => a.id === id) || APPS[0];
  currentId = app.id;
  document.querySelectorAll('.appbtn').forEach((b) => b.classList.toggle('active', b.dataset.app === app.id));
  teardown();
  clearError();
  pickEl.classList.remove('show');
  setStatus(`loading ${app.title}…`);
  try {
    let tsxText, cssText, via;
    if (files && files.tsx && files.css) {
      [tsxText, cssText] = await Promise.all([files.tsx.text(), files.css.text()]);
      via = 'picked folder';
    } else {
      const [tsxRes, cssRes] = await Promise.all([
        fetch(`${app.dir}/App.tsx`),
        fetch(`${app.dir}/index.css`),
      ]);
      if (!tsxRes.ok || !cssRes.ok) throw new Error(`fetch failed (App.tsx ${tsxRes.status}, index.css ${cssRes.status})`);
      tsxText = await tsxRes.text();
      cssText = await cssRes.text();
      via = 'lab-sources/';
    }
    injectCss(await fetchText(THEME_CSS));
    injectCss(cssText);
    await mountCompiled(await compileSource(`${app.dir}/App.tsx`, tsxText));
    history.replaceState(null, '', `?app=${app.id}`);
    setStatus(`${app.title} · live via ${via}`);
  } catch (e) {
    console.error(e);
    showError(e);
    setStatus(`${app.title} · failed to load`);
    if (!files) pickEl.classList.add('show');
  }
}

document.getElementById('pickbtn').addEventListener('click', () => pickerEl.click());
pickerEl.addEventListener('change', () => {
  const all = [...pickerEl.files];
  const byDir = new Map();
  for (const f of all) {
    const path = f.webkitRelativePath || f.name;
    const slash = path.lastIndexOf('/');
    const dir = slash < 0 ? '' : path.slice(0, slash);
    if (!byDir.has(dir)) byDir.set(dir, {});
    if (path.endsWith('/App.tsx')) byDir.get(dir).tsx = f;
    else if (path.endsWith('/index.css')) byDir.get(dir).css = f;
  }
  const app = APPS.find((a) => a.id === currentId) || APPS[0];
  const hit = [...byDir.entries()].find(([dir, pair]) => pair.tsx && pair.css &&
    (dir === app.dir || dir.endsWith('/' + app.dir) || dir === app.dir.split('/').pop()));
  if (hit) {
    loadApp(app.id, hit[1]);
  } else {
    const found = [...byDir.entries()].filter(([, pair]) => pair.tsx && pair.css).map(([dir]) => dir || '(top folder)');
    showError(`No App.tsx + index.css for "${app.title}" in the picked folder.` +
      (found.length ? `\nFolders containing an app: ${found.join(', ')}` : '\nPick the lab-sources/ folder (or one app folder).'));
    pickEl.classList.add('show');
  }
  pickerEl.value = '';
});

const params = new URLSearchParams(location.search);
const first = APPS.find((a) => a.id === params.get('app')) || APPS[0];
if (typeof Babel === 'undefined') {
  showError('Babel failed to load (network needed for CDN scripts). Check connection and reload.');
  setStatus('loader unavailable offline');
} else {
  loadApp(first.id);
}
</script>
